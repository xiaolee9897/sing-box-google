name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: bash -n sb.sh
      - name: Ensure removed legacy entrypoints stay removed
        run: |
          test ! -e serv00.sh
          test ! -e serv00keep.sh
          test ! -e app.js
          test ! -e workers_keep.js
